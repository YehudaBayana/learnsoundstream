
services:
  postgres:
    image: postgres:15-alpine
    container_name: soundstream-db
    environment:
      POSTGRES_USER: soundstream
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: soundstream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
